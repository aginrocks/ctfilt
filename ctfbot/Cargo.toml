[package]
name = "ctfbot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
base64 = "0.22.1"
color-eyre = "0.6.4"
config = "0.15.11"
dotenvy = "0.15.7"
gitea-client = "1.22.1"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
http-serde-ext = "1.0.2"
rand = "0.9.2"
reqwest = "0.12.23"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.45.0", features = ["full"] }
toml = "0.8.22"
tower = { version = "0.5.2", features = ["full", "tokio", "log"] }
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = [
    "chrono",
    "json",
    "env-filter",
    "local-time",
    "serde",
    "serde_json",
    "time",
] }
url = { version = "2.5.7", features = ["serde"] }
